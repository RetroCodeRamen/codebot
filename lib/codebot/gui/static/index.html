<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>codebot</title>
<link rel="icon" href="img/mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/app.css">
<script type="module" src="js/main.js"></script>
</head>
<body data-chrome="human">
<header class="appbar">
  <a class="brand" href="#/projects" aria-label="codebot projects"><span class="mark" aria-hidden="true">c▸</span><span class="word">codebot</span></a>
